# CI do monorepo — demonstra "pipelines independentes no mesmo repo".
#
# Ideia central: o Turborepo calcula quais pacotes foram afetados pelo diff
# e cada app só é buildado/testado/publicado se mudou ou se um pacote
# compartilhado de que ele depende mudou. Um commit da squad de ponto não
# dispara build nem deploy das outras jornadas.
#
# Detalhe importante: `turbo --affected` compara com a base branch — em PRs
# isso é o merge-base correto, mas num push para `main` o HEAD JÁ É a base,
# então --affected retornaria vazio. Por isso, em pushes usamos o range
# explícito `github.event.before...HEAD` (--filter=[sha...HEAD]).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Verificação: typecheck + build apenas do que foi afetado.
  # ------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para comparar com o merge-base / sha anterior

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch da base (PRs precisam do merge-base local)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=50 || true

      - run: pnpm install --frozen-lockfile

      - name: Pacotes afetados por este diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo ls --affected
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            pnpm turbo ls --filter="[${{ github.event.before }}...HEAD]"
          else
            pnpm turbo ls   # primeiro push: tudo
          fi

      - name: Typecheck + build (somente afetados)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run typecheck build --affected
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            pnpm turbo run typecheck build --filter="[${{ github.event.before }}...HEAD]"
          else
            pnpm turbo run typecheck build   # primeiro push: tudo
          fi

  # ------------------------------------------------------------------
  # 2. Deploy independente por app (só em main).
  #    Cada app é um job na matrix: se o app não foi afetado, o job
  #    termina em segundos sem publicar nada. Em produção, cada squad
  #    teria aqui o upload do remoteEntry.js versionado para a CDN e a
  #    atualização do manifest do Journey Registry — sem tocar no shell.
  # ------------------------------------------------------------------
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shell, mfe-ponto, mfe-beneficios, bff, legacy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detecta se @portal/${{ matrix.app }} foi afetado
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"   # primeiro push: publica tudo
          elif pnpm turbo ls --filter="[$BEFORE...HEAD]" | grep -q "@portal/${{ matrix.app }} "; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build de @portal/${{ matrix.app }}
        if: steps.check.outputs.changed == 'true'
        run: pnpm turbo run build --filter=@portal/${{ matrix.app }}

      - name: Publica artefato de @portal/${{ matrix.app }}
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "Simulação de deploy independente:"
          echo "- MFEs fariam upload de dist/ para a CDN versionada"
          echo "  (ex.: /${{ matrix.app }}/${{ github.sha }}/remoteEntry.js)"
          echo "- e atualizariam a entrada do manifest no Journey Registry."
          echo "- BFF/shell/legacy seguiriam seus próprios fluxos de release."

      - name: Nada a publicar
        if: steps.check.outputs.changed == 'false'
        run: echo "@portal/${{ matrix.app }} não foi afetado — deploy pulado."
